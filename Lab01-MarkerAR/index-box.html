<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Lab 1 — Marker AR</title>

  <!-- Load A-Frame before AR.js. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      padding: 12px 16px;
      color: white;
      background: rgba(20, 30, 45, 0.85);
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">
    Allow camera access, then show the Hiro marker.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false">

    <a-marker
      id="exhibit-marker"
      preset="hiro"
      emitevents="true">

      <a-box
        position="0 0.5 0"
        width="1"
        height="1"
        depth="1"
        color="#28B5A8">
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
