<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 02 - Virtual Exhibition</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('exhibit', {
      schema: { title: {type: 'string'}, description: {type: 'string'} },
      init: function () {
        this.originalColor = this.el.getAttribute('material').color;
        this.onClick = () => {
          const scene = this.el.sceneEl;
          scene.querySelectorAll('[exhibit]').forEach(el => {
            el.setAttribute('material', 'color', el.components.exhibit.originalColor);
          });
          this.el.setAttribute('material', 'color', '#FFDA6A');
          scene.querySelector('#info-title').setAttribute('text', 'value', this.data.title);
          scene.querySelector('#info-description').setAttribute('text', 'value', this.data.description);
          this.el.dataset.visited = 'true';
          const count = scene.querySelectorAll('[exhibit][data-visited="true"]').length;
          scene.querySelector('#progress').setAttribute('text', 'value', `Exhibits explored: ${count}/3`);
        };
        this.el.addEventListener('click', this.onClick);
      },
      remove: function () { this.el.removeEventListener('click', this.onClick); }
    });

    // Desktop navigation belongs to the rig. Disable it in immersive VR.
    AFRAME.registerComponent('desktop-navigation', {
      init: function () {
        this.enter = () => this.el.setAttribute('wasd-controls', 'enabled', false);
        this.exit = () => this.el.setAttribute('wasd-controls', 'enabled', true);
        this.el.sceneEl.addEventListener('enter-vr', this.enter);
        this.el.sceneEl.addEventListener('exit-vr', this.exit);
      },
      remove: function () {
        this.el.sceneEl.removeEventListener('enter-vr', this.enter);
        this.el.sceneEl.removeEventListener('exit-vr', this.exit);
      }
    });
  </script>
</head>
<body>
  <a-scene background="color: #DCE5EF" webxr="referenceSpaceType: local-floor">
    <a-light type="ambient" intensity="0.65"></a-light>
    <a-light type="directional" position="-3 5 2" intensity="0.8"></a-light>
    <a-plane position="0 0 -2" rotation="-90 0 0" width="10" height="10" color="#8798A5"></a-plane>
    <a-box position="0 1.75 -6" width="10" height="3.5" depth="0.15" color="#E9EDF1"></a-box>

    <!-- A 1 m reference bar: its thin shape distinguishes it from the exhibits. -->
    <a-box position="0 0.015 -1.2" width="1" height="0.03" depth="0.08" color="#172B42"></a-box>
    <a-text value="1 metre reference" position="0 0.2 -1.2" align="center" width="1.5" color="#172B42"></a-text>

    <a-text value="THE SHAPE GALLERY" position="0 3.35 -4.4" align="center" width="5" color="#172B42"></a-text>
    <!-- World-space information stays in the exhibition, not attached to the head. -->
    <a-plane position="0 2.55 -4.4" width="4.8" height="1.05" color="#172B42"></a-plane>
    <a-text id="info-title" value="Aim at an exhibit for 1.2 seconds" position="0 2.87 -4.38" align="center" width="4.5"></a-text>
    <a-text id="info-description" value="Select the cube, sphere, and cylinder to learn about their dimensions." position="0 2.55 -4.38" align="center" width="4.3" wrap-count="60"></a-text>
    <a-text id="progress" value="Exhibits explored: 0/3" position="0 2.25 -4.38" align="center" width="3"></a-text>

    <!-- Group positions are world positions. Child positions are local to each group. -->
    <a-entity id="cube-group" position="-1.6 0 -3.5">
      <a-box position="0 0.55 0" width="0.95" height="1.1" depth="0.95" color="#F1F3F5"></a-box>
      <a-box id="cube" class="clickable" position="0 1.4 0" width="0.6" height="0.6" depth="0.6" color="#3A80D2"
        exhibit="title: Cube; description: Each edge is 0.6 metres. Its centre is 1.4 metres above the floor."></a-box>
      <a-plane position="0 0.72 0.49" width="1.25" height="0.45" color="#172B42"></a-plane>
      <a-text value="CUBE\n60 cm edges" position="0 0.72 0.5" align="center" width="1.6"></a-text>
    </a-entity>

    <a-entity id="sphere-group" position="0 0 -3.5">
      <a-box position="0 0.55 0" width="0.95" height="1.1" depth="0.95" color="#F1F3F5"></a-box>
      <a-sphere id="sphere" class="clickable" position="0 1.45 0" radius="0.35" color="#C85376"
        exhibit="title: Sphere; description: Radius is 0.35 metres and diameter is 0.7 metres."></a-sphere>
      <a-plane position="0 0.72 0.49" width="1.25" height="0.45" color="#172B42"></a-plane>
      <a-text value="SPHERE\n70 cm diameter" position="0 0.72 0.5" align="center" width="1.6"></a-text>
    </a-entity>

    <a-entity id="cylinder-group" position="1.6 0 -3.5">
      <a-box position="0 0.55 0" width="0.95" height="1.1" depth="0.95" color="#F1F3F5"></a-box>
      <a-cylinder id="cylinder" class="clickable" position="0 1.45 0" radius="0.3" height="0.7" color="#329C8A"
        exhibit="title: Cylinder; description: Height is 0.7 metres and diameter is 0.6 metres."></a-cylinder>
      <a-plane position="0 0.72 0.49" width="1.25" height="0.45" color="#172B42"></a-plane>
      <a-text value="CYLINDER\n70 cm tall" position="0 0.72 0.5" align="center" width="1.6"></a-text>
    </a-entity>

    <a-entity id="rig" position="0 0 0" wasd-controls="acceleration: 12" desktop-navigation>
      <a-entity id="camera" camera look-controls position="0 1.6 0">
        <a-entity id="gaze" position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
          material="shader: flat; color: #172B42"
          cursor="rayOrigin: entity; fuse: true; fuseTimeout: 1200"
          raycaster="objects: .clickable; far: 10">
        </a-entity>
      </a-entity>
      <!-- Optional controller pointers; head-direction selection still works without them. -->
      <a-entity laser-controls="hand: left; model: false" raycaster="objects: .clickable; far: 10"></a-entity>
      <a-entity laser-controls="hand: right; model: false" raycaster="objects: .clickable; far: 10"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
